<script>
const LOW=5;
const PAL=[['var(--acc300)','var(--acc800)'],['var(--sage300)','var(--sage800)'],['#d6c7b3','#4a423a']];

const dl=n=>n==null?{t:'—',c:'zero'}:n>0?{t:'▲'+n,c:'up'}:n<0?{t:'▼'+(-n),c:'down'}:{t:'0',c:'zero'};

let agents=[],days=[],sortK='total',selected=null;

(function(){const n=new Date(),t=new Date(n.getTime()+8*36e5);let x=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate(),4));if(x<=n)x=new Date(x.getTime()+864e5);const y=new Date(x.getTime()+8*36e5);

document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{sortK=b.dataset.k;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));render();}));

function model(){
 const cur=days[days.length-1],prev=days.length>1?days[days.length-2]:null;
 if(!cur)return null;
 const list=agents.length?agents:Object.keys(cur.counts||{}).map(id=>({id,name:id}));
 const A=list.map((a,i)=>{const c=(cur.counts||{})[a.id]||[0,0],p=prev&&(prev.counts||{})[a.id];
  const sale=+c[0]||0,rent=+c[1]||0;const dS=p?sale-(+p[0]||0):null,dR=p?rent-(+p[1]||0):null;
  return{...a,sale,rent,total:sale+rent,dS,dR,dAbs:Math.abs(dS||0)+Math.abs(dR||0),pal:PAL[i%3],failed:(cur.errors||[]).includes(a.name)};});
 const sum=(arr,k)=>arr.reduce((n,a)=>n+a[k],0);
 const sale=sum(A,'sale'),rent=sum(A,'rent');
 let ps=null,pr=null;if(prev){ps=0;pr=0;list.forEach(a=>{const p=(prev.counts||{})[a.id];if(p){ps+=+p[0]||0;pr+=+p[1]||0;}});}
 return{A,cur,prev,sale,rent,total:sale+rent,dS:prev?sale-ps:null,dR:prev?rent-pr:null};
}

function setD(id,n,prefix){const d=dl(n);const e=$(id);e.textContent=(prefix||'')+d.t;e.className=prefix?d.c:'';}

function render(){
 const M=model();
 const lv=$('list-view'),dv=$('detail-view');
 if(!M){lv.hidden=false;dv.hidden=true;return;}
 $('last').textContent=fmtD(M.cur.date)+(M.cur.time?' '+M.cur.time:'');

 $('t-total').textContent=M.total;$('t-sale').textContent=M.sale;$('t-rent').textContent=M.rent;

function chart(){

 const data=days.map(d=>{let s=0,r=0;Object.entries(d.counts||{}).forEach(([k,c])=>{if(ids.length&&!ids.includes(k))return;s+=+c[0]||0;r+=+c[1]||0;});return{date:d.date,sale:s,rent:r,total:s+r};});
 if(!data.length)return;
 const W=Math.max(260,cb.clientWidth||320),H=200,m={t:12,r:6,b:26,l:34};
 const maxV=Math.max(1,...data.map(d=>d.total))*1.1;
 const step0=[1,2,5,10,20,25,50,100,200,500].find(s=>maxV/s<=5)||1000;const top=Math.ceil(maxV/step0)*step0;
 const y=v=>H-m.b-(v/top)*(H-m.t-m.b);
 const band=(W-m.l-m.r)/data.length,bw=Math.min(32,band*0.65);
 const svg=sv('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':'歷期上架件數長條圖'});
 for(let v=0;v<=top;v+=step0){svg.appendChild(sv('line',{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),stroke:'var(--divider)','stroke-width':1}));const t=sv('text',{x:m.l-6,y:y(v)+4,'text-anchor':'end','font-size':11,fill:'var(--muted)'});t.textContent=v;svg.appendChild(t);}
 svg.appendChild(sv('line',{x1:m.l,x2:W-m.r,y1:H-m.b,y2:H-m.b,stroke:'var(--axis)','stroke-width':1}));
 const every=Math.ceil(data.length/Math.max(1,Math.floor((W-m.l)/56)));
 const tip=el('div',{class:'tip',hidden:''});
 data.forEach((d,i)=>{const x=m.l+band*i+(band-bw)/2;
  svg.appendChild(sv('rect',{x,width:bw,y:y(d.sale),height:Math.max(0,y(0)-y(d.sale)),fill:'var(--acc)'}));
  svg.appendChild(sv('rect',{x,width:bw,y:y(d.total),height:Math.max(0,y(d.sale)-y(d.total)),fill:'var(--sage)',rx:4}));
  if(i%every===0){const t=sv('text',{x:x+bw/2,y:H-8,'text-anchor':'middle','font-size':11,fill:'var(--muted)'});t.textContent=String(d.date).slice(5).replace('-','/');svg.appendChild(t);}
  const hit=sv('rect',{x:m.l+band*i,width:band,y:m.t,height:H-m.t-m.b,fill:'transparent'});
  hit.addEventListener('mousemove',e=>{tip.hidden=false;tip.textContent='';tip.appendChild(el('div',{style:'color:var(--muted)',text:fmtD(d.date)}));
   [['中古屋買賣',d.sale,'var(--acc)'],['租賃',d.rent,'var(--sage)'],['合計',d.total,null]].forEach(([n,v,c])=>{const l=el('div');if(c)l.appendChild(el('i',{style:'background:'+c}));l.appendChild(document.createTextNode(n+' '+v));tip.appendChild(l);});
   const r=cb.getBoundingClientRect();let lx=e.clientX-r.left+10;if(lx+130>r.width)lx=e.clientX-r.left-140;tip.style.left=Math.max(0,lx)+'px';tip.style.top=(e.clientY-r.top-10)+'px';});
  hit.addEventListener('mouseleave',()=>{tip.hidden=true;});
  svg.appendChild(hit);});
 cb.appendChild(svg);cb.appendChild(tip);
}

let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(days.length)chart();},150);});

/* 內嵌快照：不必登入也看得到（排程每天更新）；已登入的人另外會即時讀資料庫 */
let SNAP=null;try{SNAP=JSON.parse($('snap').textContent);}catch(e){}
if(SNAP&&Array.isArray(SNAP.days)&&SNAP.days.length){agents=Array.isArray(SNAP.agents)?SNAP.agents:[];days=SNAP.days.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));render();}

(async()=>{
 let db=null;try{db=await (window.claude&&window.claude.use?window.claude.use('db'):Promise.resolve(null));}catch(e){db=null;}
 const box=$('rows');
 if(!db){if(!days.length){box.textContent='';box.appendChild(el('div',{class:'empty',text:'目前還沒有統計資料，請稍後再看。'}));}return;}
 db.doc('config/agents').onSnapshot(s=>{const d=s.data();if(d&&Array.isArray(d.list)&&d.list.length){agents=d.list;render();}},()=>{});
 db.collection('days').orderBy('date','asc').limit(1000).onSnapshot(s=>{const live=s.docs.map(x=>x.data()).filter(Boolean);
   if(live.length&&(!days.length||String(live[live.length-1].date)>=String(days[days.length-1].date))){days=live;render();}
   else if(!days.length){box.textContent='';box.appendChild(el('div',{class:'empty',text:'還沒有統計資料。每天中午 12:00 統計後會自動出現在這裡。'}));}},
  ()=>{});
})();
</script>
